# PubEcosphere 打包配置。
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pubecosphere"
version = "0.1.0"
description = "PubPeer 学术诚信周报生成管线"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10",
]

[tool.setuptools]
py-modules = ["repopath"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
