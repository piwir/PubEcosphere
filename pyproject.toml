# PubEcosphere 打包配置（src 布局）。
# 安装：pip install -e .   可编辑安装后 python -m crawler.xxx / scoring.pipeline /
# llm / agent.mcp_server 在任何目录可用。运行时依赖仅 Pillow，其余纯标准库。
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pubecosphere"
version = "0.1.0"
description = "PubPeer 学术诚信周报生成管线（crawler / scoring / llm / agent MCP）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10",
]

[tool.setuptools]
py-modules = ["repopath"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
